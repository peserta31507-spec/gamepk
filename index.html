<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Petualangan Kuadrat Jember</title>

.bx button{background:var(--ac);color:#1c1917;font-weight:700;cursor:pointer}

</style></head><body><div id="app">
<div id="hud"><span id="lv">Petualangan Kuadrat Jember</span><span id="hp"></span><span>Poin <b id="pt">0</b>/100</span><div id="bw"><div id="bar"></div></div><button id="mu">🔊</button></div>

function beep(f,d,ty='square',v=.05){if(mute||!AC||!f)return;const o=AC.createOscillator(),a=AC.createGain();o.type=ty;o.frequency.value=f;a.gain.setValueAtTime(v,AC.currentTime);a.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}

/* ===== Data soal (konteks budaya Jember) ===== */
const Q1=[
{t:'Barisan defile Jember Fashion Carnaval (JFC) tiap baris berisi x penari. Formasi memenuhi persamaan:',e:'2x² + 5x − 3 = 0',a:2,b:5,c:-3},

{t:'Harga jual tembakau kering di gudang Jember. Jodohkan:',i:[['4x² − 12x + 9 = 0',1,'D=0'],['x² − x − 6 = 0',0,'D=25'],['2x² − x + 3 = 0',2,'D=−23']]},
{t:'Produksi kue suwar-suwir per hari (ratusan bungkus). Jodohkan:',i:[['x² + 2x + 5 = 0',2,'D=−16'],['x² − 8x + 16 = 0',1,'D=0'],['5x² − 7x + 2 = 0',0,'D=9']]},
{t:'Hasil panen tembakau Na-Oogst Jember per hektare. Jodohkan:',i:[['x² − 5x + 7 = 0',2,'D=−3'],['9x² + 6x + 1 = 0',1,'D=0'],['2x² − 9x + 4 = 0',0,'D=49']]}];
const Q3=[
{t:'Lahan jeruk di Umbulsari berbentuk persegi panjang. Panjang x₁ dan lebar x₂ memenuhi:',e:'x² − 7x + 12 = 0',h:'Tentukan x₁ + x₂ (= −b/a).',a:7,x:'−(−7)/1 = 7'},
{t:'Hasil panen festival budaya Jember dibagi ke dua kelompok penari Lahbako sebesar x₁ dan x₂ ton:',e:'2x² − 10x + 8 = 0',h:'Tentukan x₁ · x₂ (= c/a).',a:4,x:'8/2 = 4'},
{t:'Dua petak sawah jeruk Umbulsari luasnya x₁ dan x₂ (are) memenuhi:',e:'x² + 3x − 10 = 0',h:'Tentukan x₁ + x₂.',a:-3,x:'−3/1 = −3'},
{t:'Bagi hasil panen jeruk koperasi Umbulsari:',e:'3x² − 12x + 9 = 0',h:'Tentukan x₁ · x₂.',a:3,x:'9/3 = 3'},
{t:'Penonton Tari Lahbako terbagi di dua tribun x₁ dan x₂ (ratusan orang):',e:'2x² + 6x − 20 = 0',h:'Tentukan x₁ · x₂.',a:-10,x:'−20/2 = −10'}];
const RQ=['Tuliskan definisi, bentuk umum, dan syarat utama dari sistem persamaan kuadrat!','Sebutkan langkah-langkah menentukan akar persamaan kuadrat dengan rumus ABC!','Bagaimana cara mencari diskriminan dan apa saja fungsinya?'];
const TT=['Level 1 · Defile JFC','Level 2 · Ular Suwar-suwir','Level 3 · Labirin Umbulsari'],
IN=['Jadilah penari JFC! Lompati keranjang tembakau 🧺, kumpulkan koin, lompat menyundul blok “?” untuk soal Drag & Drop (+20), lalu capai bendera 🏁 di ujung kanan.','Gerakkan ular pemakan suwar-suwir 🍬. Tiap makanan memunculkan soal menjodohkan. Tabrak dinding/badan = nyawa −1. Tekan BOOSTER untuk ngebut. Bendera muncul di pojok kiri bawah setelah 5 makanan muncul.','Jelajahi labirin kebun jeruk Umbulsari! Hindari 2 alien 👾, sentuh Question Box “?” untuk soal isian. Bendera ada di tengah labirin.'];
/* ===== Util UI ===== */
const show=h=>{ov.innerHTML=h;ov.style.display='flex';document.body.classList.add('q')},hide=()=>{ov.style.display='none';document.body.classList.remove('q');ov.onclick=ov.ondragstart=ov.ondrop=ov.ondragover=null};
const hud=()=>{$('#lv').textContent=S.on?TT[S.lv]:'Petualangan Kuadrat';$('#hp').textContent='❤️'.repeat(Math.max(S.lives,0))+'🖤'.repeat(3-Math.max(S.lives,0));$('#pt').textContent=S.pts;$('#bar').style.width=Math.min(S.pts,100)+'%';$('#bt').style.display=S.lv==1?'block':'none';$('#jp').style.display=S.lv==0?'block':'none'};
const add=n=>{S.pts+=n;hud();if(S.pts>=100)finish()};
function hit(){beep(110,.3,'sawtooth',.08);S.lives--;hud();if(S.lives<=0)over()}
function menu(){S.on=0;S.run=0;S.lv=0;hud();show(`<div class=bx><h2>🌿 Petualangan Kuadrat Jember</h2><p>Belajar Persamaan Kuadrat lewat budaya Jember: JFC, Tari Lahbako, tembakau, suwar-suwir &amp; jeruk Umbulsari.</p><input id=nm placeholder="Nama pemain / siswa" maxlength=40><p style="font-size:12px;opacity:.7">Kontrol: tombol layar, Panah / WASD, Spasi = lompat, B = booster</p><button id=go>▶ Mulai</button></div>`);$('#go').onclick=()=>{S.name=$('#nm').value.trim()||'Siswa';S.sc=[0,0,0];hide();start(0)}}
function start(l){S.lv=l;S.lives=3;S.pts=0;S.pause=1;S.run=0;S.on=1;hud();[i1,i2,i3][l]();show(`<div class=bx><h2>${TT[l]}</h2><p>${IN[l]}</p><p style="font-size:13px;opacity:.8">3 nyawa · koin +2 · jawaban benar +20 · selesai di 100 poin atau saat menyentuh bendera</p><button id=go>Mulai</button></div>`);$('#go').onclick=()=>{hide();S.pause=0;S.run=1;music(l)}}
function finish(){if(!S.run)return;S.run=0;const l=S.lv;S.sc[l]=Math.min(S.pts,100);beep(880,.4);show(`<div class=bx><h2>🏁 Level ${l+1} selesai!</h2><p>Skor level: <b>${S.sc[l]}</b></p><button id=nx>${l<2?'Level berikutnya':'Babak Bonus'}</button></div>`);$('#nx').onclick=()=>{hide();l<2?start(l+1):refl()}}
function over(){S.run=0;show(`<div class=bx><h2>💔 Nyawa habis</h2><p>Jangan menyerah, ulangi level ini!</p><button id=rt>Ulangi Level</button></div>`);$('#rt').onclick=()=>{hide();start(S.lv)}}
/* ===== Kuis ===== */
function ask(type,q){S.pause=1;const done=ok=>{hide();S.pause=0;if(ok)add(20)};({dd,mt,ct})[type](q,done)}
function fb(ok,m,done){show(`<div class=bx><h2>${ok?'✅ Benar! +20':'❌ Belum tepat'}</h2><p>${m}</p><button id=nx>Lanjut</button></div>`);$('#nx').onclick=()=>done(ok);beep(ok?988:150,.25,ok?'square':'sawtooth')}
function dd(q,done){const v=[q.a,q.b,q.c],pool=[...v];for(const x of [-q.a,-q.b,-q.c,q.a+1,q.b+2,q.c-1,q.a*2,q.b*2,q.c*2,7,9,11,13]){if(pool.length>=6)break;if(!pool.includes(x))pool.push(x)}pool.sort(()=>Math.random()-.5);let sel=null,P=[null,null,null];
const r=()=>{show(`<div class=bx><p>${q.t}</p><h3>${q.e}</h3><p style="font-size:13px">Seret atau ketuk angka, lalu ketuk kotak a, b, c</p><div class=row>${'abc'.split('').map((l,i)=>`<div class=sl data-s=${i}>${l} = <b>${P[i]==null?'?':pool[P[i]]}</b></div>`).join('')}</div><div class=row>${pool.map((x,i)=>P.includes(i)?'':`<div class="ch${sel===i?' on':''}" draggable=true data-c=${i}>${x}</div>`).join('')}</div><button id=ok>Periksa</button></div>`);$('#ok').onclick=()=>{const ok=P.every((p,i)=>p!=null&&pool[p]==v[i]);fb(ok,`Jawaban: a = ${q.a}, b = ${q.b}, c = ${q.c}`,done)}};
r();ov.onclick=e=>{const c=e.target.closest('[data-c]'),s=e.target.closest('[data-s]');if(c)sel=+c.dataset.c;else if(s){const i=+s.dataset.s;if(sel!=null){P[i]=sel;sel=null}else P[i]=null}else return;r()};
ov.ondragstart=e=>{sel=+e.target.dataset.c;e.dataTransfer.setData('text','x')};ov.ondragover=e=>e.preventDefault();
ov.ondrop=e=>{const s=e.target.closest('[data-s]');if(s&&sel!=null){P[+s.dataset.s]=sel;sel=null;r()}}}
function mt(q,done){show(`<div class=bx><p>${q.t}</p>${q.i.map((x,i)=>`<div class=mr><span>${x[0]}</span><select id=s${i}><option value=-1>Pilih…</option>${OP.map((o,j)=>`<option value=${j}>${o}</option>`).join('')}</select></div>`).join('')}<button id=ok>Cocokkan</button></div>`);
$('#ok').onclick=()=>{const ok=q.i.every((x,i)=>+$('#s'+i).value==x[1]);fb(ok,'Gunakan D = b² − 4ac → '+q.i.map(x=>x[2]).join('; '),done)}}
function ct(q,done){show(`<div class=bx><p>${q.t}</p><h3>${q.e}</h3><p>${q.h}</p><input id=an placeholder="Ketik jawaban (angka)" inputmode=text><button id=ok>Kirim</button></div>`);
$('#ok').onclick=()=>{const v=parseFloat($('#an').value.replace(',','.').replace('−','-'));fb(v===q.a,'Jawaban: '+q.a+' ('+q.x+')',done)}}
/* ===== Latar & helper gambar ===== */
const PAL=[['#7dd3fc','#fef3c7'],['#14532d','#052e16'],['#1e1b4b','#0f172a']],LV=[...Array(10)].map((_,i)=>({x:i*83+20,y:i*47,s:12+i%3*5,p:i}));
const rr=(x,y,w,h,r)=>{g.beginPath();g.roundRect(x,y,w,h,r);g.fill()};
function bg(l,c){const a=g.createLinearGradient(0,0,0,H);a.addColorStop(0,PAL[l][0]);a.addColorStop(1,PAL[l][1]);g.fillStyle=a;g.fillRect(0,0,W,H);
if(l==0){g.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<5;i++){const x=((i*230+T*8-c*.2)%1000+1000)%1000-100,y=50+i*28%90;g.beginPath();g.ellipse(x,y,50,16,0,0,7);g.ellipse(x+30,y-8,30,14,0,0,7);g.fill()}
g.fillStyle='#86efac';for(let i=-1;i<8;i++){g.beginPath();g.ellipse(i*200-(c*.4)%200+100,410,140,80,0,0,7);g.fill()}}
g.fillStyle=l?'rgba(190,242,100,.2)':'rgba(101,163,13,.35)';LV.forEach(v=>{const y=(v.y+T*v.s)%(H+20)-10,x=v.x+Math.sin(T*.6+v.p)*25;g.save();g.translate(x,y);g.rotate(Math.sin(T+v.p));g.beginPath();g.ellipse(0,0,9,4,0,0,7);g.fill();g.restore()})}
const em=(s,x,y,z=30)=>{g.font=z+'px serif';g.fillText(s,x,y)};
/* ===== LEVEL 1: Platformer ===== */
function i1(){L={x:60,y:360,vy:0,cam:0,inv:0,q:[500,1100,1700,2300,2900].map((x,i)=>({x,y:285,i,u:0})),o:[800,1250,1550,2000,2450,2750,3200].map(x=>({x})),c:[...Array(14)].map((_,i)=>({x:300+i*220,y:320-(i%3)*40,t:0}))}}
function u1(dt){const s=dt*60;L.x=Math.max(20,Math.min(3560,L.x+(K.r-K.l)*4*s));if(K.u&&L.y>=360){L.vy=-13;beep(660,.1)}L.vy+=.65*s;L.y+=L.vy*s;if(L.y>=360){L.y=360;L.vy=0}
L.cam=Math.max(0,Math.min(2800,L.x-300));L.inv-=s;const px=L.x,py=L.y;
L.o.forEach(o=>{if(L.inv<=0&&px+28>o.x&&px<o.x+36&&py+40>364){L.inv=90;L.x+=px<o.x?-70:70;L.vy=-6;hit()}});
L.q.forEach(q=>{if(!q.u&&px+28>q.x&&px<q.x+36&&py<q.y+36&&py+40>q.y){q.u=1;L.vy=2;ask('dd',Q1[q.i])}});
L.c.forEach(k=>{if(!k.t&&Math.hypot(px+14-k.x,py+20-k.y)<28){k.t=1;beep(1200,.08);add(2)}});if(px>3480)finish()}
function d1(){const c=L.cam;g.save();g.translate(-c,0);g.fillStyle='#78350f';g.fillRect(c,400,W,80);g.fillStyle='#65a30d';g.fillRect(c,400,W,10);
g.fillStyle='#4d7c0f';for(let x=c-c%90;x<c+W;x+=90){g.beginPath();g.ellipse(x+20,398,20,9,.4,0,7);g.ellipse(x+45,396,16,7,-.4,0,7);g.fill()}
L.o.forEach(o=>{g.fillStyle='#b45309';rr(o.x,364,36,36,6);g.fillStyle='#fbbf24';g.fillRect(o.x+4,372,28,4);g.fillRect(o.x+4,384,28,4)});
L.q.forEach(q=>{g.fillStyle=q.u?'#94a3b8':'#fbbf24';rr(q.x,q.y,36,36,6);g.fillStyle='#78350f';g.font='bold 24px sans-serif';g.fillText(q.u?'✓':'?',q.x+11,q.y+27)});
L.c.forEach(k=>{if(!k.t){g.fillStyle='#facc15';g.beginPath();g.arc(k.x,k.y,9,0,7);g.fill();g.fillStyle='#fff8';g.fillRect(k.x-2,k.y-5,3,10)}});
em('🏁',3490,398,44);
if(!(L.inv>0&&(T*12|0)%2)){const x=L.x,y=L.y;g.fillStyle='#e11d48';rr(x,y+14,28,26,8);g.fillStyle='#fcd9b6';g.beginPath();g.arc(x+14,y+12,10,0,7);g.fill();['#facc15','#14b8a6','#f472b6','#facc15'].forEach((cl,i)=>{g.fillStyle=cl;g.beginPath();g.ellipse(x+4+i*7,y-2,3,10,(i-1.5)*.35,0,7);g.fill()})}
g.restore()}
/* ===== LEVEL 2: Snake ===== */
const wl=(x,y)=>x<1||y<1||x>18||y>10||L.w.has(x+','+y);
function fr(x,y){return !wl(x,y)&&!L.sn.some(s=>s.x==x&&s.y==y)&&!(L.f&&L.f.x==x&&L.f.y==y)&&!L.co.some(c=>c.x==x&&c.y==y)&&!(x==1&&y==10)}
function rnd(){let x,y;do{x=1+Math.random()*18|0;y=1+Math.random()*10|0}while(!fr(x,y));return{x,y}}
function food(){if(L.sp<5){L.f=rnd();L.sp++;if(L.sp==5)L.fl=1}}
function i2(){L={sn:[{x:5,y:6},{x:4,y:6},{x:3,y:6}],d:{x:1,y:0},nd:{x:1,y:0},t:0,w:new Set(['5,3','5,4','5,5','14,6','14,7','14,8','9,9','10,9','9,2','10,2','16,2','3,8']),f:null,sp:0,fl:0,co:[],qi:0};for(let i=0;i<10;i++)L.co.push(rnd());food()}
function u2(dt){if(K.l&&L.d.x==0)L.nd={x:-1,y:0};if(K.r&&L.d.x==0)L.nd={x:1,y:0};if(K.u&&L.d.y==0)L.nd={x:0,y:-1};if(K.d&&L.d.y==0)L.nd={x:0,y:1};
L.t+=dt*1000;if(L.t<(K.b?160:1000))return;L.t=0;L.d=L.nd;const h={x:L.sn[0].x+L.d.x,y:L.sn[0].y+L.d.y};

function d2(){g.fillStyle='rgba(255,255,255,.04)';for(let x=0;x<20;x++)for(let y=0;y<12;y++)if((x+y)%2)g.fillRect(x*C,y*C,C,C);
g.fillStyle='#92400e';for(let x=0;x<20;x++)for(let y=0;y<12;y++)if(wl(x,y))rr(x*C+2,y*C+2,C-4,C-4,8);
L.co.forEach(c=>{g.fillStyle='#facc15';g.beginPath();g.arc(c.x*C+20,c.y*C+20,8,0,7);g.fill()});

L.sn.forEach((s,i)=>{g.fillStyle=i?`hsl(${150-i*4},65%,50%)`:'#bef264';rr(s.x*C+3,s.y*C+3,C-6,C-6,12)});
const h=L.sn[0];g.fillStyle='#111';[[-6,-4],[6,-4]].forEach(o=>{g.beginPath();g.arc(h.x*C+20+o[0]+L.d.x*5,h.y*C+20+o[1]+L.d.y*5,3,0,7);g.fill()})}
/* ===== LEVEL 3: Pacman ===== */
const MZ=['####################','#P....#......#.....#','#.##.##.####.#.###.#','#.#Q.....#.........#','#.#.####.#.#####.#.#','#...#M..Q.F..#...#.#','#.#.#.#####.##.#.#.#','#.#...#.....Q..#.#.#','#.#####.###.####.#.#','#Q..........M.....Q#','#.######.##.#####..#','####################'];
function i3(){L={m:MZ.map((r,y)=>r.split('').map((c,x)=>c=='P'||c=='M'?'.':c)),p:{x:1,y:1},dx:1,dy:1,d:[0,0],w:[0,0],t:0,mt:0,inv:0,a:0,qi:0,ms:[{x:5,y:5,dx:5,dy:5,d:null},{x:12,y:9,dx:12,dy:9,d:null}]};
L.m.forEach((r,y)=>r.forEach((c,x)=>{if(c=='.'&&(x*7+y*3)%9==0)r[x]='c'}))}
function mv(m){const dist=d=>Math.abs(m.x+d[0]-L.p.x)+Math.abs(m.y+d[1]-L.p.y);const o=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>L.m[m.y+d[1]][m.x+d[0]]!='#');let f=o.filter(d=>!(m.d&&d[0]==-m.d[0]&&d[1]==-m.d[1]));if(!f.length)f=o;
const c=Math.random()<.45?f.reduce((a,b)=>dist(b)<dist(a)?b:a):f[Math.random()*f.length|0];m.d=c;m.x+=c[0];m.y+=c[1]}
function u3(dt){L.inv-=dt;if(K.l)L.w=[-1,0];else if(K.r)L.w=[1,0];else if(K.u)L.w=[0,-1];else if(K.d)L.w=[0,1];
L.t+=dt;if(L.t>=.16){L.t=0;const ok=d=>(d[0]||d[1])&&L.m[L.p.y+d[1]][L.p.x+d[0]]!='#';if(ok(L.w))L.d=L.w;if(ok(L.d)){L.p.x+=L.d[0];L.p.y+=L.d[1];L.a=Math.atan2(L.d[1],L.d[0]);const ch=L.m[L.p.y][L.p.x];
if(ch=='c'){L.m[L.p.y][L.p.x]='.';beep(1200,.08);add(2)}else if(ch=='Q'){L.m[L.p.y][L.p.x]='q';ask('ct',Q3[L.qi++])}else if(ch=='F')finish()}else L.d=[0,0]}
L.mt+=dt;if(L.mt>=.5){L.mt=0;L.ms.forEach(mv)}
if(L.inv<=0&&L.ms.some(m=>m.x==L.p.x&&m.y==L.p.y)){L.inv=1.5;L.p={x:1,y:1};L.d=[0,0];L.w=[0,0];hit()}}
function d3(){L.dx+=(L.p.x-L.dx)*.3;L.dy+=(L.p.y-L.dy)*.3;
L.m.forEach((r,y)=>r.forEach((c,x)=>{if(c=='#'){g.fillStyle='#1e3a8a';g.strokeStyle='#38bdf8';g.lineWidth=2;g.beginPath();g.roundRect(x*C+3,y*C+3,C-6,C-6,8);g.fill();g.stroke()}
else if(c=='c'){g.fillStyle='#facc15';g.beginPath();g.arc(x*C+20,y*C+20,7,0,7);g.fill()}
else if(c=='Q'||c=='q'){g.fillStyle=c=='Q'?'#fbbf24':'#475569';rr(x*C+5,y*C+5,30,30,6);g.fillStyle='#78350f';g.font='bold 22px sans-serif';g.fillText(c=='Q'?'?':'✓',x*C+13,y*C+28)}
else if(c=='F')em('🏁',x*C+4,y*C+32)}));
L.ms.forEach(m=>{m.dx+=(m.x-m.dx)*.2;m.dy+=(m.y-m.dy)*.2;em('👾',m.dx*C+3,m.dy*C+31)});
if(!(L.inv>0&&(T*12|0)%2)){const cx=L.dx*C+20,cy=L.dy*C+20,mo=.1+.3*Math.abs(Math.sin(T*10));g.fillStyle='#facc15';g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,15,L.a+mo,L.a+6.28-mo);g.fill()}}
/* ===== Refleksi, nilai & PDF ===== */
function refl(){S.run=0;show(`<div class="bx wide"><h2>🌟 Babak Bonus: Refleksi</h2>${RQ.map((q,i)=>`<label>${i+1}. ${q}</label><textarea id=r${i} rows=3></textarea>`).join('')}<p id=er class=bad></p><button id=ok>Selesai</button></div>`);
$('#ok').onclick=()=>{S.ans=RQ.map((_,i)=>$('#r'+i).value.trim());if(S.ans.some(a=>a.length<5)){$('#er').textContent='Ketiga pertanyaan wajib diisi.';return}dash()}}
const grade=a=>a>=90?'A+':a>=80?'A':a>=70?'A-':a>=60?'B+':a>=50?'B':'B-';
function dash(){const t=S.sc.reduce((a,b)=>a+b,0),av=t/3,gr=grade(av);
show(`<div class=bx><h2>🏆 Dashboard Nilai</h2><p><b>${S.name}</b></p><p>Skor Level 1: <b>${S.sc[0]}</b><br>Skor Level 2: <b>${S.sc[1]}</b><br>Skor Level 3: <b>${S.sc[2]}</b></p><p>Total: <b>${t}</b> · Rata-rata: <b>${av.toFixed(1)}</b></p><h2 style="font-size:40px">${gr}</h2><p id=er class=bad></p><button id=pdf>Cetak PDF</button><button id=ag>Main Lagi</button></div>`);
$('#ag').onclick=()=>{hide();menu()};$('#pdf').onclick=()=>pdf(t,av,gr)}
async function pdf(t,av,gr){const J=window.jspdf;if(!J){$('#er').textContent='Library PDF belum termuat (cek koneksi).';return}

wr('Laporan Game Persamaan Kuadrat - Petualangan Jember',1,16);y+=4;wr('Nama: '+S.name);wr('Tanggal bermain: '+new Date().toLocaleDateString('id-ID',{dateStyle:'long'}));y+=4;

wr('Jawaban Refleksi',1,13);RQ.forEach((q,i)=>{y+=2;wr((i+1)+'. '+q,1);wr(S.ans[i])});
const b=d.output('blob'),fn='Nilai_'+S.name.replace(/\W+/g,'_')+'.pdf';
try{const dl=window.claude&&await claude.use('downloads');if(dl)await dl.save({filename:fn,data:b});else d.save(fn)}catch(e){if(!e||e.code!='declined')$('#er').textContent='Gagal menyimpan PDF.'}}

bg(S.on?S.lv:0,S.on&&S.lv==0?L.cam||0:0);if(S.on)[d1,d2,d3][S.lv]();requestAnimationFrame(loop)}
